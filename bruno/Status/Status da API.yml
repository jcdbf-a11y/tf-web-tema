info:
  name: Status da API
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/status"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar status ok", function() {
          expect(res.getBody().status).to.equal('ok');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
