info:
  name: Listar serviços
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/servicos"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 200", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("deve retornar uma lista", function() {
          expect(res.getBody()).to.be.an('array');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
