info:
  name: Buscar serviço inexistente
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/servicos/999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 404 para servico inexistente", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("deve retornar mensagem de erro", function() {
          expect(res.getBody().erro).to.equal('Serviço não encontrado.');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
