info:
  name: Buscar item inexistente
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/items/999"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar status 404 para item inexistente", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("deve retornar mensagem de erro", function() {
          expect(res.getBody().erro).to.equal('Item não encontrado.');
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
